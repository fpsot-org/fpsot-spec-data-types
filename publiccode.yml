publiccodeYmlVersion: "0.4"
name: FPSOT data types specification
url: "https://github.com/fpsot-org/fpsot-spec-data-types"
platforms:
  - web
categories:
  - it-development
developmentStatus: concept
softwareType: "standalone/other"
description:
  en:
    shortDescription: Data type rules for FPSOT systems.
    longDescription: >
      Rules for how FPSOT systems store and exchange text, dates, times,
      durations, time zones, numbers, money, identifiers, booleans, code
      values and coordinates, with one JSON form and one LinkML type each.
    features:
      - RFC 3339 dates and times in UTC
      - Money as a decimal string with an ISO 4217 currency
      - UUID version 7 identifiers
      - Bilingual text keyed by language tag
  fr:
    shortDescription: Règles sur les types de données des systèmes FPSOT.
    longDescription: >
      Règles sur la façon dont les systèmes FPSOT conservent et échangent
      le texte, les dates, les heures, les durées, les fuseaux horaires, les
      nombres, l’argent, les identifiants, les booléens, les valeurs de code
      et les coordonnées, avec une forme JSON et un type LinkML pour chacun.
    features:
      - Dates et heures du RFC 3339 en UTC
      - Argent en chaîne décimale avec une monnaie ISO 4217
      - Identifiants UUID de version 7
      - Texte bilingue indexé par étiquette de langue
