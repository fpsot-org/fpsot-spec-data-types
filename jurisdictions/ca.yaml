code: CA
name: {en: Canada, fr: Canada}
rows:
  - id: DAT-001
    text: {en: "APIs published across the government or outside it must use UTF-8. Other encodings are allowed for single-purpose or internal APIs when UTF-8 is not technically possible.", fr: "Les API publiées dans l’ensemble du gouvernement ou à l’extérieur doivent employer l’UTF-8. D’autres codages sont permis pour les API à usage unique ou internes quand l’UTF-8 est techniquement impossible."}
    status: looser
    source: {title: "Government of Canada Standards on APIs", date: "2026-08-12", url: "https://www.canada.ca/en/government/system/digital-government/digital-government-innovations/government-canada-standards-apis.html", archive: "https://web.archive.org/web/20261017061648/https://www.canada.ca/en/government/system/digital-government/digital-government-innovations/government-canada-standards-apis.html"}
    last_checked: "2026-11-04"
  - id: DAT-004
    text: {en: "English and French content in API data is nested under the BCP 47 keys en and fr.", fr: "Le contenu anglais et français des données d’API est imbriqué sous les clés BCP 47 en et fr."}
    status: same
    source: {title: "Government of Canada Standards on APIs", date: "2026-08-12", url: "https://www.canada.ca/en/government/system/digital-government/digital-government-innovations/government-canada-standards-apis.html", archive: "https://web.archive.org/web/20261017061648/https://www.canada.ca/en/government/system/digital-government/digital-government-innovations/government-canada-standards-apis.html"}
    last_checked: "2026-11-04"
  - id: DAT-010
    text: {en: "API timestamps use ISO 8601 in UTC, in the form yyyy-mm-ddThh:mm:ssZ. The API converts any other source form.", fr: "Les horodatages des API emploient l’ISO 8601 en UTC, sous la forme aaaa-mm-jjThh:mm:ssZ. L’API convertit toute autre forme de la source."}
    status: same
    source: {title: "Government of Canada Standards on APIs", date: "2026-08-12", url: "https://www.canada.ca/en/government/system/digital-government/digital-government-innovations/government-canada-standards-apis.html", archive: "https://web.archive.org/web/20261017061648/https://www.canada.ca/en/government/system/digital-government/digital-government-innovations/government-canada-standards-apis.html"}
    last_checked: "2026-11-04"
  - id: DAT-014
    text: {en: "API dates use the form yyyy-mm-dd.", fr: "Les dates des API emploient la forme aaaa-mm-jj."}
    status: same
    source: {title: "Government of Canada Standards on APIs", date: "2026-08-12", url: "https://www.canada.ca/en/government/system/digital-government/digital-government-innovations/government-canada-standards-apis.html", archive: "https://web.archive.org/web/20261017061648/https://www.canada.ca/en/government/system/digital-government/digital-government-innovations/government-canada-standards-apis.html"}
    last_checked: "2026-11-04"
  - id: DAT-030
    text: {en: "When a time needs a time zone, it carries an offset from UTC in hours and minutes. The standard names no time zone database.", fr: "Quand une heure a besoin d’un fuseau horaire, elle porte un décalage par rapport à l’UTC en heures et en minutes. La norme ne nomme aucune base de données de fuseaux horaires."}
    status: looser
    source: {title: "Data Reference Standard on Date and Time Format", date: "2024-09-27", url: "https://www.canada.ca/en/government/system/digital-government/digital-government-innovations/enabling-interoperability/gc-enterprise-data-reference-standards/data-reference-standard-date-time-format.html", archive: "https://web.archive.org/web/20260415170434/https://www.canada.ca/en/government/system/digital-government/digital-government-innovations/enabling-interoperability/gc-enterprise-data-reference-standards/data-reference-standard-date-time-format.html"}
    last_checked: "2026-11-04"
