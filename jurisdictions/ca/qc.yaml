code: CA-QC
name: {en: Québec, fr: Québec}
rows:
  - id: DAT-001
    text: {en: "Every open data file saved as text, including CSV, JSON and GeoJSON, must use UTF-8.", fr: "Tout fichier de données ouvertes enregistré en texte, y compris en CSV, en JSON et en GeoJSON, doit employer l’UTF-8."}
    status: same
    source: {title: "Lignes directrices sur la diffusion de données ouvertes, Données Québec", url: "https://www.donneesquebec.ca/lignes-directrices-sur-la-diffusion-de-donnees-ouvertes/", archive: "https://web.archive.org/web/20261024232216/https://www.donneesquebec.ca/lignes-directrices-sur-la-diffusion-de-donnees-ouvertes/"}
    last_checked: "2026-11-04"
  - id: DAT-010
    text: {en: "Dates and times follow ISO 8601, with a T between the date and the time. No rule sets UTC or an offset.", fr: "Les dates et les heures suivent l’ISO 8601, avec un T entre la date et l’heure. Aucune règle n’impose l’UTC ni un décalage."}
    status: looser
    source: {title: "Lignes directrices sur la diffusion de données ouvertes, Données Québec", url: "https://www.donneesquebec.ca/lignes-directrices-sur-la-diffusion-de-donnees-ouvertes/", archive: "https://web.archive.org/web/20261024232216/https://www.donneesquebec.ca/lignes-directrices-sur-la-diffusion-de-donnees-ouvertes/"}
    last_checked: "2026-11-04"
  - id: DAT-014
    text: {en: "Dates must follow ISO 8601 in the form AAAA-MM-JJ.", fr: "Les dates doivent suivre l’ISO 8601 sous la forme AAAA-MM-JJ."}
    status: same
    source: {title: "Lignes directrices sur la diffusion de données ouvertes, Données Québec", url: "https://www.donneesquebec.ca/lignes-directrices-sur-la-diffusion-de-donnees-ouvertes/", archive: "https://web.archive.org/web/20261024232216/https://www.donneesquebec.ca/lignes-directrices-sur-la-diffusion-de-donnees-ouvertes/"}
    last_checked: "2026-11-04"
  - id: DAT-050
    text: {en: "Monetary values are in Canadian dollars, with a point as the decimal separator. No currency field or exact form is set.", fr: "Les valeurs monétaires sont en dollars canadiens, avec un point comme séparateur décimal. Aucun champ de monnaie ni aucune forme exacte n’est fixé."}
    status: looser
    source: {title: "Lignes directrices sur la diffusion de données ouvertes, Données Québec", url: "https://www.donneesquebec.ca/lignes-directrices-sur-la-diffusion-de-donnees-ouvertes/", archive: "https://web.archive.org/web/20261024232216/https://www.donneesquebec.ca/lignes-directrices-sur-la-diffusion-de-donnees-ouvertes/"}
    last_checked: "2026-11-04"
  - id: DAT-070
    text: {en: "Booleans use simple pairs, such as TRUE and FALSE, Vrai and Faux, or Oui and Non. The pair is a suggestion.", fr: "Les booléens emploient des paires simples, comme TRUE et FALSE, Vrai et Faux, ou Oui et Non. La paire est une suggestion."}
    status: looser
    source: {title: "Lignes directrices sur la diffusion de données ouvertes, Données Québec", url: "https://www.donneesquebec.ca/lignes-directrices-sur-la-diffusion-de-donnees-ouvertes/", archive: "https://web.archive.org/web/20261024232216/https://www.donneesquebec.ca/lignes-directrices-sur-la-diffusion-de-donnees-ouvertes/"}
    last_checked: "2026-11-04"
  - id: DAT-080
    text: {en: "WGS 84 is the recommended system for vector data, published as GeoJSON up to 150 MB. NAD83(CSRS) is accepted for precise work.", fr: "Le WGS 84 est le système recommandé pour les données vectorielles, diffusées en GeoJSON jusqu’à 150 Mo. Le NAD83(SCRS) est accepté pour les travaux précis."}
    status: looser
    source: {title: "Lignes directrices sur la diffusion de données ouvertes, 4. Données géospatiales, Données Québec", url: "https://www.donneesquebec.ca/lignes-directrices-sur-la-diffusion-de-donnees-ouvertes/donnees-geospatiales/", archive: "https://web.archive.org/web/20260614101447/https://www.donneesquebec.ca/lignes-directrices-sur-la-diffusion-de-donnees-ouvertes/donnees-geospatiales/"}
    last_checked: "2026-11-04"
