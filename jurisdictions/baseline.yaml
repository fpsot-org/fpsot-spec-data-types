# Comparison data. The format is defined by fpsot-spec-doc (model/jurisdiction.yaml).
topics:
  encoding: {en: Text encoding, fr: Codage du texte}
  multilingual-text: {en: Multilingual text, fr: Texte multilingue}
  instants: {en: Instants, fr: Instants}
  dates: {en: Dates, fr: Dates}
  time-zones: {en: Time zones, fr: Fuseaux horaires}
  money: {en: Money, fr: Argent}
  booleans: {en: Booleans, fr: Booléens}
  coordinates: {en: Coordinates, fr: Coordonnées}
rows:
  - id: DAT-001
    topic: encoding
    requirement: {en: Text uses UTF-8 without a byte order mark., fr: Le texte emploie l’UTF-8 sans indicateur d’ordre des octets.}
    international: {en: "JSON sent between systems outside a closed group uses UTF-8. A sender adds no byte order mark.", fr: "Le JSON échangé hors d’un groupe fermé de systèmes emploie l’UTF-8. L’expéditeur n’ajoute pas d’indicateur d’ordre des octets."}
    international_source: {title: "RFC 8259, The JavaScript Object Notation (JSON) Data Interchange Format", version: "STD 90", date: "2017-12", url: "https://www.rfc-editor.org/rfc/rfc8259", archive: "https://web.archive.org/web/20261026222354/https://www.rfc-editor.org/info/rfc8259/"}
    fpsot: {en: "UTF-8 for all stored and exchanged text, with no byte order mark.", fr: "UTF-8 pour tout texte conservé ou échangé, sans indicateur d’ordre des octets."}
  - id: DAT-004
    topic: multilingual-text
    requirement: {en: Multilingual text is an object keyed by language tag., fr: Le texte multilingue est un objet dont les clés sont des étiquettes de langue.}
    international: {en: "BCP 47 defines language tags such as en and fr. It sets no data structure for text in several languages.", fr: "Le BCP 47 définit les étiquettes de langue comme en et fr. Il ne fixe aucune structure de données pour le texte en plusieurs langues."}
    international_source: {title: "RFC 5646, Tags for Identifying Languages (BCP 47)", version: "BCP 47", date: "2009-09", url: "https://www.rfc-editor.org/rfc/rfc5646", archive: "https://web.archive.org/web/20261027004131/https://www.rfc-editor.org/info/rfc5646/"}
    fpsot: {en: "A JSON object with one member per language tag. FPSOT text has both en and fr.", fr: "Un objet JSON avec un membre par étiquette de langue. Le texte de FPSOT a à la fois en et fr."}
  - id: DAT-010
    topic: instants
    requirement: {en: An instant is an RFC 3339 date and time in UTC with Z., fr: Un instant est une date et une heure du RFC 3339 en UTC avec Z.}
    international: {en: "A timestamp carries a UTC offset or Z. Lower-case t and z are allowed, and the year has four digits.", fr: "Un horodatage porte un décalage par rapport à l’UTC ou un Z. Les lettres t et z en minuscules sont permises, et l’année a quatre chiffres."}
    international_source: {title: "RFC 3339, Date and Time on the Internet: Timestamps", version: "RFC 3339", date: "2002-07", url: "https://www.rfc-editor.org/rfc/rfc3339", archive: "https://web.archive.org/web/20261022094524/https://www.rfc-editor.org/info/rfc3339/"}
    fpsot: {en: "UTC only, with a capital T and a final capital Z, such as 2026-11-04T15:30:00Z.", fr: "UTC seulement, avec un T et un Z final en majuscules, comme 2026-11-04T15:30:00Z."}
  - id: DAT-014
    topic: dates
    requirement: {en: A date without a time is YYYY-MM-DD., fr: Une date sans heure s’écrit AAAA-MM-JJ.}
    international: {en: "A full date has a four-digit year, a two-digit month and a two-digit day, joined by hyphens.", fr: "Une date complète a une année de quatre chiffres, un mois et un jour de deux chiffres, reliés par des traits d’union."}
    international_source: {title: "RFC 3339, Date and Time on the Internet: Timestamps", version: "RFC 3339", date: "2002-07", url: "https://www.rfc-editor.org/rfc/rfc3339", archive: "https://web.archive.org/web/20261022094524/https://www.rfc-editor.org/info/rfc3339/"}
    fpsot: {en: "A full date such as 2026-11-04, never an instant at midnight.", fr: "Une date complète comme 2026-11-04, jamais un instant à minuit."}
  - id: DAT-030
    topic: time-zones
    requirement: {en: A time zone is an IANA time zone name., fr: Un fuseau horaire est un nom de fuseau de l’IANA.}
    international: {en: "The IANA database names each zone after a region, such as America/Toronto, and records its rules since 1970.", fr: "La base de données de l’IANA nomme chaque fuseau d’après une région, comme America/Toronto, et consigne ses règles depuis 1970."}
    international_source: {title: "Time Zone Database", version: "2026f", date: "2026-10-27", url: "https://www.iana.org/time-zones", archive: "https://web.archive.org/web/20261102142415/https://www.iana.org/time-zones"}
    fpsot: {en: "An IANA zone name, never an offset or an abbreviation. The database release is fixed in the build.", fr: "Un nom de fuseau de l’IANA, jamais un décalage ni une abréviation. La version de la base de données est fixée dans la construction."}
  - id: DAT-050
    topic: money
    requirement: {en: An amount of money is an object with an amount and a currency., fr: Un montant d’argent est un objet avec un montant et une monnaie.}
    international: {en: "ISO 4217 gives each currency an alphabetic code, a numeric code and the number of its minor units. It sets no data format.", fr: "La norme ISO 4217 donne à chaque monnaie un code alphabétique, un code numérique et son nombre de décimales. Elle ne fixe aucun format de données."}
    international_source: {title: "ISO 4217, Codes for the representation of currencies", version: "ISO 4217:2015", date: "2015-08", url: "https://www.iso.org/standard/64758.html", archive: "https://web.archive.org/web/20261027000453/https://www.iso.org/standard/64758.html"}
    fpsot: {en: "An object with amount as a decimal string and currency as an ISO 4217 alphabetic code. Never a float.", fr: "Un objet avec amount en chaîne décimale et currency en code alphabétique ISO 4217. Jamais de virgule flottante."}
  - id: DAT-070
    topic: booleans
    requirement: {en: A boolean is the JSON literal true or false., fr: Un booléen est le littéral JSON true ou false.}
    international: {en: "JSON has the two literals true and false, in lower case.", fr: "Le JSON a deux littéraux, true et false, en minuscules."}
    international_source: {title: "RFC 8259, The JavaScript Object Notation (JSON) Data Interchange Format", version: "STD 90", date: "2017-12", url: "https://www.rfc-editor.org/rfc/rfc8259", archive: "https://web.archive.org/web/20261026222354/https://www.rfc-editor.org/info/rfc8259/"}
    fpsot: {en: "true or false only, never a string or a number.", fr: "true ou false seulement, jamais une chaîne ni un nombre."}
  - id: DAT-080
    topic: coordinates
    requirement: {en: "Coordinates use WGS 84 with the longitude first.", fr: "Les coordonnées emploient le WGS 84, avec la longitude d’abord."}
    international: {en: "GeoJSON positions use WGS 84 decimal degrees, longitude then latitude. The crs member is gone.", fr: "Les positions GeoJSON emploient les degrés décimaux du WGS 84, la longitude puis la latitude. Le membre crs n’existe plus."}
    international_source: {title: "RFC 7946, The GeoJSON Format", version: "RFC 7946", date: "2016-08", url: "https://www.rfc-editor.org/rfc/rfc7946", archive: "https://web.archive.org/web/20260515125207/https://www.rfc-editor.org/rfc/rfc7946"}
    fpsot: {en: "GeoJSON geometry in WGS 84, longitude first, at most six decimal places.", fr: "Géométrie GeoJSON en WGS 84, la longitude d’abord, au plus six décimales."}
